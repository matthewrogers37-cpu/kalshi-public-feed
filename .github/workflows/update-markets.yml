name: Refresh public Kalshi sports feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-public-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out feed
        uses: actions/checkout@v4

      - name: Fetch public market prices
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, rename, writeFile } from "node:fs/promises";

          const API_BASE = "https://api.elections.kalshi.com/trade-api/v2/events";
          const TARGET_SERIES = [
            "KXNFLGAME", "KXNFLSPREAD", "KXNFLTOTAL",
            "KXNCAAFGAME", "KXNCAAFSPREAD", "KXNCAAFTOTAL",
            "KXMLBGAME", "KXMLBSPREAD", "KXMLBTOTAL",
            "KXEPLGAME", "KXLALIGAGAME", "KXBUNDESLIGAGAME",
            "KXSERIEAGAME", "KXLIGUE1GAME",
            "KXUFCFIGHT", "KXUFCMOV", "KXUFCROUNDS"
          ];

          const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const isTarget = (market) => TARGET_SERIES.some((series) =>
            String(market?.event_ticker || "").startsWith(`${series}-`)
          );
          const publicFields = (market, event) => ({
            ticker: market.ticker,
            event_ticker: market.event_ticker,
            event_title: event.title,
            event_sub_title: event.sub_title,
            event_mutually_exclusive: event.mutually_exclusive,
            title: market.title,
            subtitle: market.subtitle,
            yes_sub_title: market.yes_sub_title,
            no_sub_title: market.no_sub_title,
            status: market.status,
            yes_bid_dollars: market.yes_bid_dollars,
            yes_ask_dollars: market.yes_ask_dollars,
            no_bid_dollars: market.no_bid_dollars,
            no_ask_dollars: market.no_ask_dollars,
            last_price_dollars: market.last_price_dollars,
            volume_fp: market.volume_fp,
            volume_24h_fp: market.volume_24h_fp,
            open_interest_fp: market.open_interest_fp,
            liquidity_dollars: market.liquidity_dollars,
            close_time: market.close_time,
            expected_expiration_time: market.expected_expiration_time,
            occurrence_datetime: market.occurrence_datetime,
            floor_strike: market.floor_strike,
            cap_strike: market.cap_strike,
            functional_strike: market.functional_strike
          });

          async function fetchPage(series, cursor = "") {
            const url = new URL(API_BASE);
            url.searchParams.set("series_ticker", series);
            url.searchParams.set("status", "open");
            url.searchParams.set("with_nested_markets", "true");
            url.searchParams.set("limit", "200");
            if (cursor) url.searchParams.set("cursor", cursor);
            let lastError = `${series}: Kalshi did not respond.`;
            for (let attempt = 0; attempt < 4; attempt += 1) {
              const response = await fetch(url, {
                headers: { Accept: "application/json", "User-Agent": "Matts-Kalshi-Public-Feed/1.2" }
              });
              if (response.ok) return response.json();
              lastError = `${series}: Kalshi returned ${response.status}.`;
              if (response.status !== 429 || attempt === 3) break;
              await wait(1_500 * (2 ** attempt));
            }
            throw new Error(lastError);
          }

          async function fetchSeries(series) {
            const events = [];
            let cursor = "";
            for (let page = 0; page < 10; page += 1) {
              const payload = await fetchPage(series, cursor);
              if (Array.isArray(payload.events)) events.push(...payload.events);
              cursor = typeof payload.cursor === "string" ? payload.cursor : "";
              if (!cursor) break;
              await wait(500);
            }
            return events;
          }

          const collected = [];
          const seriesCounts = {};
          const seriesErrors = {};
          for (const series of TARGET_SERIES) {
            try {
              const events = await fetchSeries(series);
              const matches = events.flatMap((event) =>
                Array.isArray(event.markets)
                  ? event.markets.filter(isTarget).map((market) => publicFields(market, event))
                  : []
              );
              seriesCounts[series] = matches.length;
              collected.push(...matches);
            } catch (error) {
              seriesErrors[series] = error instanceof Error ? error.message : String(error);
            }
            await wait(750);
          }

          const markets = Array.from(
            new Map(collected.map((market) => [market.ticker, market])).values()
          );
          if (!markets.length) {
            throw new Error("No matching football, baseball, soccer, or UFC markets; preserving the last good feed.");
          }

          const output = {
            schema_version: 2,
            fetched_at: new Date().toISOString(),
            source: "Kalshi public Trade API",
            target_series: TARGET_SERIES,
            series_counts: seriesCounts,
            series_errors: seriesErrors,
            market_count: markets.length,
            markets
          };
          await mkdir("data", { recursive: true });
          await writeFile("data/markets.json.tmp", `${JSON.stringify(output, null, 2)}\n`, "utf8");
          await rename("data/markets.json.tmp", "data/markets.json");
          console.log(`Saved ${markets.length} public sports markets.`);
          NODE

      - name: Publish changed feed
        shell: bash
        run: |
          if git diff --quiet -- data/markets.json && git ls-files --error-unmatch data/markets.json >/dev/null 2>&1; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "Kalshi Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json
          git commit -m "Refresh public sports markets"
          git push
